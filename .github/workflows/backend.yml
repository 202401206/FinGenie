name: Backend and SQL CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and SQL Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      # Tests use synthetic Auth/Storage and offline or mocked AI providers.
      FINGENIE_SUPABASE_URL: ""
      FINGENIE_SUPABASE_PUBLISHABLE_KEY: ""
      FINGENIE_GROQ_API_KEY: ""

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node for the local SQL harness
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Install the pinned SQL test engine
        run: npm ci --prefix supabase/tests --ignore-scripts

      - name: Check Python dependencies
        run: python -m pip check

      - name: Lint backend code and tests
        run: python -m ruff check backend

      - name: Check Python formatting
        run: python -m ruff format --check backend

      - name: Run all migration and SQL behavior suites
        run: npm test --prefix supabase/tests

      - name: Audit local SQL ownership and privileges
        run: npm run test:security --prefix supabase/tests

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q --strict-markers --junitxml=../test-results/backend.xml

      - name: Run explicit parser and owned-analysis acceptance checks
        working-directory: backend
        run: >-
          python -m pytest -q --strict-markers
          verification/test_balance_parser_persistence.py
          verification/test_owned_analysis_api.py
          --junitxml=../test-results/sprint-2-acceptance.xml

      - name: Reject empty or skipped test reports
        run: >-
          python backend/scripts/check_test_results.py
          test-results/backend.xml test-results/sprint-2-acceptance.xml

      - name: Verify mounted Sprint 2 API prerequisites
        run: python backend/scripts/verify_sprint2.py --readiness-only

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: test-results/*.xml
          if-no-files-found: ignore
          retention-days: 7
